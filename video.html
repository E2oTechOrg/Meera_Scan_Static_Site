    <style>
        /* =============================================
           SHORTS VIDEO SECTION
        ============================================== */

        .shorts-section {
            background: #f8fafc;
            padding: 60px 0 80px;
        }

        /* Grid */
        .shorts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
            justify-items: center;
        }

        /* Card */
        .shorts-card {
            width: 100%;
            max-width: 260px;
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 8px 28px rgba(34, 58, 102, 0.09);
            border: 1px solid #eef1f6;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .shorts-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 44px rgba(34, 58, 102, 0.15);
        }

        /* Video wrapper */
        .shorts-video-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #111;
            overflow: hidden;
        }

        .shorts-video-wrap video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Overlay */
        .shorts-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 20, 50, 0.35);
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .shorts-overlay i {
            font-size: 48px;
            color: #fff;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
        }

        /* Hide overlay when playing, show when paused */
        .shorts-card.playing .shorts-overlay {
            opacity: 0;
        }

        .shorts-card:not(.playing) .shorts-overlay {
            opacity: 1;
        }

        /* Duration badge */
        .shorts-duration {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.60);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        /* Info */
        .shorts-info {
            padding: 14px 16px 18px;
        }

        .shorts-info h6 {
            font-size: 14px;
            font-weight: 700;
            color: #223a66;
            margin: 0 0 4px;
            line-height: 1.4;
        }

        .shorts-info span {
            font-size: 12px;
            color: #e12454;
            font-weight: 600;
        }

        /* Mute / Unmute button */
        .mute-btn {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            border: none;
            color: #fff;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: background 0.2s ease;
        }

        .mute-btn:hover {
            background: rgba(225, 36, 84, 0.85);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .shorts-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }
        }

        @media (max-width: 480px) {
            .shorts-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .shorts-card {
                max-width: 100%;
            }
        }
    </style>
